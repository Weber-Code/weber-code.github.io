  It lists the apps in apps.json, which every deploy regenerates.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WeberCode Apps</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="module" crossorigin src="./landing-assets/index-CdqOK0wV.js"></script>
    <link rel="stylesheet" crossorigin href="./landing-assets/index-3ymbbuhe.css">
  </head>
  <body>
    <main>
      <header>
        <div class="logo" id="logo" aria-hidden="true"></div>
        <div>
          <h1>WeberCode Apps</h1>

      </header>
      <ul class="apps" id="apps"></ul>
      <p class="message" id="message" hidden></p>
    </main>
  </body>
</html>
