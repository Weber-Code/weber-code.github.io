  - name: Alta Devices
    description: Solar Energy Company
    position: Metrology Intern
    url: https://www.altadevices.com/
    startDate: '2012-06-01'
    endDate: '2012-09-01'
    summary: >
      Design, assemble, and program a semi-autonomous GaAs wafer analysis machine
      with OCR to read laser-engraved wafers, optical sensors to assess resurfacing needs,
      custom-designed parts to transport wafers between stations, safety mechanisms to protect users during operation,
      and data collection software written and managed in Igor Pro 6.

