work:
  - name: Synap
    description: Software Company
    position: Senior Software Engineer
    url: https://www.synap.io/
    startDate: '2016-07-01'
    summary: >
      Design, collaboratively plan, program, test, and deploy full-stack applications
      using Angular, Nest.js, Docker, and AWS.

    highlights:
      - Automated the collection of assay data for a laboratory.
        Worked with scientists, data analysts, and project managers
        to design and implement an efficient, internally-hosted web-application.
        Automation led to an increase in company throughput on state-mandated, environmental, and private mining projects.

      - Automated a physical dice game for insurance and promotion agencies to lease at special events.
        Collaborated with a mechanical engineer to design, wire, prototype, orders parts for, and program
        the lighting, actuation, and video capture from an embedded Linux board for portability and offline use.

      - Automated the creation of collateral for a graphic design firm using Adobe InDesign Server.
        Project can be white-labeled as a product for the firm to sell to other graphic design companies.

      - Architected, consulted on, and prototyped an offline-first, social-accomplishment project
        consisting of a cloud server, a PWA, a hybrid native app, and a desktop app.

      - Reverse engineered and improved on delivery of manufacturing quoting / estimation software
        with limited organization and documentation available.

      - Boosted camaraderie, code quality, practices, and productivity of internal practices
        by supervising, training, and advising coworkers and new employees in their software development tasks.

  - name: Inspire Products
    description: Manufacturing Company
    position: Manufacturing Engineer
    url: http://www.inspireproducts.com/
    startDate: '2014-07-01'
    endDate: '2016-05-01'
    summary: >
      Program, tool, fixture, inspect, maintain, and run plastic injection machines and multi-axis CNC machines
      with 3-7 degrees of freedom to create high-quality medical devices.

    highlights:
      - Ensured success on bedside medical device project by drafting up an estimate for a delivery date
        which saved the shop manager from under-delivering to the customer.

      - Further accelerated production by introducing flow control logic to manager's G-code,
        then handled machining, assembly, inspection, documentation, and shipping of 10 prototypes
        which immediately landed additional order of 50 more devices.

  - name: Innovative Drive
    description: Engineering Company
    position: Research & Development Intern
    url: http://www.innovativedrive.com/
    startDate: '2013-06-01'
    endDate: '2013-08-01'
    summary: >
